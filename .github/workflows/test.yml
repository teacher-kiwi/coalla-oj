name: 테스트

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 백엔드 (flake8 + Django 테스트)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlinejudge
          POSTGRES_USER: onlinejudge
          POSTGRES_PASSWORD: onlinejudge
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U onlinejudge"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      OJ_ENV: dev
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: onlinejudge
      POSTGRES_USER: onlinejudge
      POSTGRES_PASSWORD: onlinejudge
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/deploy/requirements.txt

      # psycopg2 는 소스에서 빌드되므로 pg_config 가 필요하다
      - name: 시스템 패키지
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev

      - name: 파이썬 패키지
        run: pip install -r backend/deploy/requirements.txt

      # settings 가 임포트 시점에 /data/config/secret.key 를 읽는다(DATA_DIR="/data").
      # 컨테이너에서는 entrypoint.sh 가 만들어 주는 자리라 CI 에서는 직접 만든다.
      - name: /data 준비
        run: |
          sudo mkdir -p /data/config /data/log /data/test_case \
                        /data/public/upload /data/public/avatar /data/public/website
          sudo chown -R "$USER" /data
          head -c 32 /dev/urandom | md5sum | head -c 32 > /data/config/secret.key
          cp backend/data/public/avatar/default.png /data/public/avatar/
          cp backend/data/public/website/favicon.ico /data/public/website/

      - name: flake8
        working-directory: backend
        run: flake8 --statistics .

      - name: Django 테스트
        working-directory: backend
        run: python manage.py test --settings=oj.settings

  frontend:
    name: 프론트엔드 (ESLint + 빌드)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: 빌드
        working-directory: frontend
        run: npm run build
