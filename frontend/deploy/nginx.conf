server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # 번들이 수 MB 라 압축하지 않으면 좁은 회선(학교 망)에서 수십 초가 걸린다.
    # 이미 압축된 것(이미지·폰트)은 목록에 넣지 않는다.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    # 기본값 1 은 덜 줄인다. 6 으로 두면 첫 로딩이 846KB 에서 721KB 가 된다.
    # 압축한 결과는 클라우드플레어가 캐시하므로 매 요청마다 다시 압축하지 않는다.
    gzip_comp_level 6;
    gzip_types application/javascript text/css application/json image/svg+xml;

    # vite 산출물은 이름에 내용 해시가 붙는다(index-DVKSaFtY.js). 내용이 바뀌면
    # 이름도 바뀌므로 영구 캐시가 안전하다. 캐시 헤더가 없으면 브라우저가 방문할
    # 때마다 재검증을 걸어 화면이 뜨기까지의 왕복이 늘어난다.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 수식 라이브러리와 편집기 아이콘. 버전을 올릴 때만 바뀌는 파일이라 길게 둔다.
    location ~ ^/(katex/|md-editor-icons\.js$|website/) {
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # static assets must be served as real files, not rewritten to index.html
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 1y;
    }

    # 올린 그림. 이름이 무작위라 내용이 바뀌면 주소도 바뀐다(utils/views.py).
    location /public/ {
        alias /data/public/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # admin 은 vite MPA 의 두 번째 엔트리라 산출물이 /admin.html 이다.
    # 라우터는 createWebHistory('/admin/') 이므로 /admin/* 은 전부 admin.html 로 보낸다.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri /admin.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}