server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 100m;

    root /usr/share/nginx/html;
    index index.html;

    # static assets must be served as real files, not rewritten to index.html
    location /static/ {
        alias /usr/share/nginx/html/static/;
        access_log off;
        expires 1y;
    }

    location /public/ {
        alias /data/public/;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # admin 은 vite MPA 의 두 번째 엔트리라 산출물이 /admin.html 이다.
    # 라우터는 createWebHistory('/admin/') 이므로 /admin/* 은 전부 admin.html 로 보낸다.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        try_files $uri /admin.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}