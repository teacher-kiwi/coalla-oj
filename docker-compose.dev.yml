services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - ${DATA_DIR:-./data}/redis:/data

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-onlinejudge}
      - POSTGRES_USER=${POSTGRES_USER:-onlinejudge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data

  judge:
    build:
      context: ./judge
      dockerfile: Dockerfile
    container_name: judge
    restart: unless-stopped
    read_only: true
    cap_drop:
      - SETPCAP
      - MKNOD
      - NET_BIND_SERVICE
      - SYS_CHROOT
      - SETFCAP
      - FSETID
    tmpfs:
      - /tmp
    volumes:
      - ${DATA_DIR:-./data}/backend/test_case:/test_case:ro
      - ${DATA_DIR:-./data}/judge_server/log:/log
      - ${DATA_DIR:-./data}/judge_server/run:/judger
    environment:
      - SERVICE_URL=http://judge:8080
      - BACKEND_URL=http://backend:8000/api/judge_server_heartbeat/
      - TOKEN=${JUDGE_SERVER_TOKEN:?JUDGE_SERVER_TOKEN 을 .env 에 설정하세요}

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: backend
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
      - judge
    volumes:
      - ${DATA_DIR:-./data}/backend:/data
      - ./backend:/app
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-onlinejudge}
      - POSTGRES_USER=${POSTGRES_USER:-onlinejudge}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      - JUDGE_SERVER_TOKEN=${JUDGE_SERVER_TOKEN:?JUDGE_SERVER_TOKEN 을 .env 에 설정하세요}
      # 최초 기동 시 root 계정 비밀번호
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD 를 .env 에 설정하세요}
      - OJ_ENV=dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: deploy/Dockerfile.dev
    container_name: frontend-dev
    depends_on:
      - backend
    ports:
      - "${FRONTEND_DEV_PORT:-8080}:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - TARGET=http://backend:8000
      - VITE_VERSION=${VITE_VERSION:-coalla-oj-dev}
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 8080"
